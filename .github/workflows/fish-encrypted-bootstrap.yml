name: Fish Audio encrypted bootstrap
on:
  workflow_dispatch:
permissions: {}
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install sealed-box library before exposing secret
        run: python3 -m pip install --quiet PyNaCl==1.5.0
      - name: Seal Fish key for the fixed infrastructure repository
        env:
          FISHAUDIO_APIKEY: ${{ secrets.FISHAUDIO_APIKEY }}
        run: |
          python3 - <<'SEAL'
          import base64, json, os
          from pathlib import Path
          from nacl import encoding, public
          secret = os.environ.get('FISHAUDIO_APIKEY')
          if not secret:
              raise SystemExit('Organization Fish secret is unavailable')
          key = public.PublicKey('lAeHxyGD92NScAal5gHu7orVOXEqRFA3K6juIv3Uh1Y='.encode(), encoding.Base64Encoder())
          ciphertext = public.SealedBox(key).encrypt(secret.encode())
          Path('sealed.json').write_text(json.dumps({'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(ciphertext).decode()}))
          print('Encrypted for densematrix/infrastructure only; no plaintext output')
          SEAL
      - uses: actions/upload-artifact@v4
        with:
          name: fish-sealed-for-infrastructure
          path: sealed.json
          retention-days: 1
